spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baby_planet?characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:planet}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${ACCOUNT_SECURE_COOKIE:false}
server.error.include-message=never
